name: live-mermail

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Hosted Mermail MCP round-trip (self-addressed challenge, receipt draft, search, receipt-check)
        env:
          MERMAIL_API_KEY: ${{ secrets.MERMAIL_API_KEY }}
        run: node tests/live-mermail.mjs
