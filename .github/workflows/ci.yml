name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Skill script matches the Mermail PR branch
        run: |
          base=https://raw.githubusercontent.com/bryankwandou/mermail-skills/feat/mermail-countersig/skills/mermail-countersig/scripts
          for f in countersig.mjs evm.mjs; do
            curl -fsSL "$base/$f" | diff -q - "skill/scripts/$f"
          done
      - name: Payout gate policy
        run: npm run test:gate
      - name: Red-team cases (flooding, forged receipts, Base replay)
        run: npm run test:attack
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
