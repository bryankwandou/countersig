name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Skill script matches the Mermail PR branch
        run: |
          base=https://raw.githubusercontent.com/bryankwandou/mermail-skills/feat/mermail-countersig/skills/mermail-countersig/scripts
          for f in countersig.mjs evm.mjs; do
            curl -fsSL "$base/$f" | diff -q - "skill/scripts/$f"
          done
      - name: Payout gate policy
        run: npm run test:gate
      - name: Red-team cases (flooding, forged receipts, Base replay)
        run: npm run test:attack
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  upstream-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the exact branch submitted in Nudgen-Marketing/mermail-skills#268
        run: git clone --depth 1 -b feat/mermail-countersig https://github.com/bryankwandou/mermail-skills.git pr
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Official validator plus Countersig checks (npm test)
        working-directory: pr
        run: |
          npm install --no-audit --no-fund
          npm test
