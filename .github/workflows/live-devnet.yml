name: live-devnet

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Re-read recorded attack scenarios on Solana devnet (no keys)
        run: node tests/live-devnet.mjs
      - name: Re-read recorded Base Sepolia scenarios (no keys)
        run: node tests/live-base.mjs
